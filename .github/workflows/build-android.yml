name: Build Android APK - شبیه ساز کشور

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.2.2 + Templates
        run: |
          echo "Downloading Godot..."
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          echo "Downloading export templates..."
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/
          ls ~/.local/share/godot/export_templates/4.2.2.stable/ | head -n 20
          echo "Godot installed:"
          godot --version

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore "$PWD/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          echo "Keystore created at: $PWD/debug.keystore"
          mkdir -p build

      - name: Configure Godot export settings (SDK + keystore)
        run: |
          # ۱) Editor Settings - فایل صحیح Godot 4.x: editor_settings-4.tres
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          echo "Editor settings written to editor_settings-4.tres"

          # ۲) تزریق keystore مستقیم به preset (مسیر مطلق) - اطمینان مضاعف
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$PWD/debug.keystore\"|" export_presets.cfg
          grep -q 'keystore/debug_user' export_presets.cfg || sed -i 's|keystore/debug=.*|&\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"|' export_presets.cfg
          grep 'keystore' export_presets.cfg

      - name: Godot Import and parse validation
        run: |
          godot --headless --path . --import --verbose

      - name: Run simulation and UI tests
        run: |
          set -euo pipefail
          python3 tests/validate_country_data.py
          python3 tests/validate_world_map.py
          python3 tests/validate_country_maps.py
          godot --headless --path . res://tests/test_scene.tscn
          godot --headless --path . res://tests/test_long.tscn
          godot --headless --path . -s res://tests/test_ui.gd

          # تست یکپارچه واقعی: دو پردازش Godot از طریق ENet
          godot --headless --path . -s res://tests/test_network_host.gd > /tmp/network-host.log 2>&1 &
          HOST_PID=$!
          sleep 1
          CLIENT_STATUS=0
          HOST_STATUS=0
          godot --headless --path . -s res://tests/test_network_client.gd > /tmp/network-client.log 2>&1 || CLIENT_STATUS=$?
          wait "$HOST_PID" || HOST_STATUS=$?
          cat /tmp/network-host.log
          cat /tmp/network-client.log
          test "$HOST_STATUS" -eq 0 -a "$CLIENT_STATUS" -eq 0

          # تست رقابتی واقعی: دو کشور و State مستقل روی ENet
          godot --headless --path . -s res://tests/test_competitive_host.gd > /tmp/competitive-host.log 2>&1 &
          COMP_HOST_PID=$!
          sleep 1
          COMP_CLIENT_STATUS=0
          COMP_HOST_STATUS=0
          godot --headless --path . -s res://tests/test_competitive_client.gd > /tmp/competitive-client.log 2>&1 || COMP_CLIENT_STATUS=$?
          wait "$COMP_HOST_PID" || COMP_HOST_STATUS=$?
          cat /tmp/competitive-host.log
          cat /tmp/competitive-client.log
          test "$COMP_HOST_STATUS" -eq 0 -a "$COMP_CLIENT_STATUS" -eq 0

      - name: Export Android APK (Debug)
        run: |
          mkdir -p build
          # Godot 4 exports via --export-debug
          godot --headless --path . --export-debug "Android" build/country-sim-debug.apk --verbose
          ls -lh build/

      - name: Export Linux (for testing)
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/country-sim.x86_64 --verbose || true
          ls -lh build/linux/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/*.apk
            build/linux/*

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "ساخت خودکار ${{ github.run_number }} - شبیه ساز کشور"
          body: |
            🎮 شبیه‌ساز کشور - ساخت خودکار اندروید
            
            این نسخه به صورت خودکار توسط GitHub Actions ساخته شده است.
            
            ### نصب:
            - فایل `country-sim-debug.apk` را دانلود کنید
            - در گوشی گزینه "نصب از منابع ناشناس" را فعال کنید
            - نصب کنید
            
            - ساخته شده در: ${{ github.event.head_commit.timestamp }}
            - کامیت: ${{ github.sha }}
            
            ✅ رایگان و متن‌باز - مطابق قانون ۵ پروژه
          files: |
            build/country-sim-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
