name: Build Android APK - شبیه ساز کشور

env:
  GODOT_VERSION: "4.7.1"
  GODOT_CHANNEL: "stable"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot 4.7.1 export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-${{ runner.os }}-4.7.1-stable-export-templates-v1

      - name: Install Godot 4.7.1 stable + Templates
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_CHANNEL}"
          ARCHIVE="Godot_v${TAG}_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${TAG}_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"

          echo "Downloading Godot ${TAG}..."
          wget -q "https://github.com/godotengine/godot/releases/download/${TAG}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          chmod +x "Godot_v${TAG}_linux.x86_64"
          sudo mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "Downloading Godot ${TAG} export templates..."
            wget -q "https://github.com/godotengine/godot/releases/download/${TAG}/${TEMPLATE_ARCHIVE}"
            unzip -q "$TEMPLATE_ARCHIVE"
            mkdir -p "$TEMPLATE_DIR"
            mv templates/* "$TEMPLATE_DIR/"
          else
            echo "Using cached Godot export templates."
          fi

          echo "Godot installed:"
          godot --version | tee /tmp/godot-version.txt
          grep -q "^${GODOT_VERSION}.${GODOT_CHANNEL}.official" /tmp/godot-version.txt
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/linux_debug.x86_64"
          ls -lh "$TEMPLATE_DIR" | head -n 20

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore "$PWD/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          echo "Keystore created at: $PWD/debug.keystore"
          mkdir -p build

      - name: Configure Godot export settings (SDK + keystore)
        run: |
          # ۱) Editor Settings - فایل صحیح Godot 4.x: editor_settings-4.tres
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          echo "Editor settings written to editor_settings-4.tres"

          # ۲) تزریق keystore مستقیم به preset (مسیر مطلق) - اطمینان مضاعف
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$PWD/debug.keystore\"|" export_presets.cfg
          grep -q 'keystore/debug_user' export_presets.cfg || sed -i 's|keystore/debug=.*|&\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"|' export_presets.cfg
          # keystore ریلیز هم مسیر مطلق می‌گیرد (فایل در گام Export ساخته می‌شود)
          sed -i "s|keystore/release=\"ci-release.keystore\"|keystore/release=\"$PWD/ci-release.keystore\"|" export_presets.cfg
          grep 'keystore' export_presets.cfg

      - name: Godot Import and parse validation
        run: |
          godot --headless --path . --import --verbose

      - name: Run simulation and UI tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 tests/validate_engine_version.py
          python3 tests/validate_ui_architecture.py
          python3 tests/validate_country_data.py
          python3 tests/validate_world_map.py
          python3 tests/validate_country_maps.py
          python3 tests/validate_engine_contracts.py
          # هر تست Godot سقف زمانی دارد تا گیرکردنِ یک تست، جوپ را برای همیشه
          # متوقف نکند (بیلدهای قبلی ۲.۵ دقیقه بودند؛ برخی ران‌ها >۵ ساعت گیر
          # کرده بودند). شکستِ timeout با پیام واضح گزارش می‌شود.
          timeout 180 godot --headless --path . res://tests/test_scene.tscn || { echo "TIMEOUT/FAIL: test_scene.tscn"; exit 1; }
          timeout 240 godot --headless --path . res://tests/test_long.tscn || { echo "TIMEOUT/FAIL: test_long.tscn"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_ui.gd || { echo "TIMEOUT/FAIL: test_ui.gd"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_save_compat.gd || { echo "TIMEOUT/FAIL: test_save_compat.gd"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_toast_render.gd || { echo "TIMEOUT/FAIL: test_toast_render.gd"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_multi_command.gd || { echo "TIMEOUT/FAIL: test_multi_command.gd"; exit 1; }
          timeout 180 godot --headless --path . -s res://tests/test_scenarios.gd || { echo "TIMEOUT/FAIL: test_scenarios.gd"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_mega_event.gd || { echo "TIMEOUT/FAIL: test_mega_event.gd"; exit 1; }
          timeout 120 godot --headless --path . -s res://tests/test_cabinet_life.gd || { echo "TIMEOUT/FAIL: test_cabinet_life.gd"; exit 1; }

          # تست یکپارچه واقعی: دو پردازش Godot از طریق ENet.
          # هر نمونه در دایرکتوری خودش اجرا می‌شود تا race روی .godot (cache مشترک)
          # رخ ندهد — دو نمونه‌ی همزمان با یک .godot، گاهی «File not found» می‌دادند.
          cp -r . /tmp/GameHost
          cp -r . /tmp/GameClient
          rm -rf /tmp/GameHost/.godot /tmp/GameHost/.git /tmp/GameClient/.godot /tmp/GameClient/.git
          godot --headless --path /tmp/GameHost --import > /tmp/import-host.log 2>&1
          godot --headless --path /tmp/GameClient --import > /tmp/import-client.log 2>&1
          (cd /tmp/GameHost && timeout 120 godot --headless --path . -s res://tests/test_network_host.gd > /tmp/network-host.log 2>&1) &
          HOST_PID=$!
          sleep 2
          CLIENT_STATUS=0
          HOST_STATUS=0
          (cd /tmp/GameClient && timeout 120 godot --headless --path . -s res://tests/test_network_client.gd > /tmp/network-client.log 2>&1) || CLIENT_STATUS=$?
          wait "$HOST_PID" || HOST_STATUS=$?
          cat /tmp/network-host.log
          cat /tmp/network-client.log
          test "$HOST_STATUS" -eq 0 -a "$CLIENT_STATUS" -eq 0

          # تست رقابتی واقعی: دو کشور و State مستقل روی ENet (دایرکتوری‌های جدا)
          (cd /tmp/GameHost && timeout 120 godot --headless --path . -s res://tests/test_competitive_host.gd > /tmp/competitive-host.log 2>&1) &
          COMP_HOST_PID=$!
          sleep 2
          COMP_CLIENT_STATUS=0
          COMP_HOST_STATUS=0
          (cd /tmp/GameClient && timeout 120 godot --headless --path . -s res://tests/test_competitive_client.gd > /tmp/competitive-client.log 2>&1) || COMP_CLIENT_STATUS=$?
          wait "$COMP_HOST_PID" || COMP_HOST_STATUS=$?
          cat /tmp/competitive-host.log
          cat /tmp/competitive-client.log
          test "$COMP_HOST_STATUS" -eq 0 -a "$COMP_CLIENT_STATUS" -eq 0

      - name: Run deep Godot tests (30 tests outside CI suite)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # تست‌های عمقی که در مرحلهٔ اصلی نیستند (عمق‌بخشی ۳۹: همگی سبز شدند).
          for t in test_deeper3 test_deeper4 test_deeper5 test_deeper6 test_deeper7 \
                   test_deeper8 test_deeper9 test_deeper10 test_deeper11 test_deeper12 \
                   test_deeper13 test_deeper14 test_deeper15 test_deeper16 test_deeper17 \
                   test_deeper18 test_deeper21 test_depth_systems test_depth2_systems \
                   test_leader_system test_multiplayer_turn test_sync_tick test_turn_system \
                   test_once_buttons test_balanced_depth test_continued_depth test_even_deeper \
                   test_max_depth test_more_depth; do
            timeout 120 godot --headless --path . -s res://tests/$t.gd || { echo "TIMEOUT/FAIL: $t"; exit 1; }
          done

      - name: Export Android APK (Release)
        run: |
          mkdir -p build
          # کلید امضای موقت CI (هر اجرا ساخته می‌شود؛ در ریپو ذخیره نمی‌شود).
          # برای انتشار رسمی Google Play باید keystore اختصاصی خود را جایگزین کنید.
          if [ ! -f ci-release.keystore ]; then
            keytool -genkeypair -v -keystore ci-release.keystore -alias game \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Country Simulator, OU=Game, O=OpenSource, L=Internet, C=US"
          fi
          # خروجی release به‌جای debug: تمپلیت release موتور بسیار کوچک‌تر است
          # (libgodot_android.so دیباگ ~۷۶ مگابایت بود)
          godot --headless --path . --export-release "Android" build/country-sim.apk --verbose
          ls -lh build/

      - name: Export Linux (for testing)
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/country-sim.x86_64 --verbose || true
          ls -lh build/linux/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/*.apk
            build/linux/*

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "ساخت خودکار ${{ github.run_number }} - شبیه ساز کشور"
          body: |
            🎮 شبیه‌ساز کشور - ساخت خودکار اندروید
            
            این نسخه به صورت خودکار توسط GitHub Actions ساخته شده است.
            
            ### نصب:
            - فایل `country-sim.apk` را دانلود کنید
            - در گوشی گزینه "نصب از منابع ناشناس" را فعال کنید
            - نصب کنید
            
            - ساخته شده در: ${{ github.event.head_commit.timestamp }}
            - موتور: Godot ${{ env.GODOT_VERSION }} stable
            - کامیت: ${{ github.sha }}
            
            ✅ رایگان و متن‌باز - مطابق قانون ۵ پروژه
          files: |
            build/country-sim.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
